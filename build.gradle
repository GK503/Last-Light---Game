plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'
// configure Java compatibility via the java extension (avoid setting unknown top-level properties)

repositories {
    mavenCentral()
}

dependencies {
}

java {
    // Use the traditional JavaVersion constants which are available in the Groovy DSL
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
